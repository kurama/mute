name: Promote release

# Phase 2 of the two-step release. Run this MANUALLY once Apple has ACCEPTED the
# App Store build (you get the email). It publishes the staged draft GitHub release
# and points the Homebrew tap at it. Until this runs nothing is public, so Homebrew
# can never serve a version the App Store rejected.
#
# Phase 1 (build, App Store upload, notarized DMG, draft release) is release.yml,
# triggered by pushing the vX.Y.Z tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to promote (e.g. v1.0.0). It must already have a draft release from the Release workflow.'
        required: true
        type: string

jobs:
  promote:
    name: Publish & update Homebrew
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the staged DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::No release found for $VERSION. Tag and build it first (Release workflow)."
            exit 1
          fi
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern Mute.dmg --dir build
          test -f build/Mute.dmg

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          # Undraft first so the release download URL the cask points at is live
          # before the tap commit lands.
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          RAW="${{ inputs.version }}"
          VERSION="${RAW#v}"
          SHA256=$(sha256sum build/Mute.dmg | awk '{print $1}')

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/kurama/homebrew-tap.git"
          mkdir -p homebrew-tap/Casks

          cat > homebrew-tap/Casks/mute.rb << EOF
          cask "mute" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/kurama/mute/releases/download/v#{version}/Mute.dmg"

            name "Mute"
            desc "Automatically enables Do Not Disturb when your mic or camera is active"
            homepage "https://github.com/kurama/mute"

            app "Mute.app"
          end
          EOF

          cd homebrew-tap
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add Casks/mute.rb
          git commit -m "chore: update mute to ${VERSION}"
          git push
