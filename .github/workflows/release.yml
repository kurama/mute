name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to release (e.g. v1.0.0)'
        required: true
        type: string
      include_appstore:
        description: 'Also upload to the App Store'
        type: boolean
        default: false

env:
  SCHEME: mute
  PROJECT: mute.xcodeproj
  BUNDLE_ID: kurama.mute
  TEAM_ID: LHJ9S8C3G8

jobs:
  # ── App Store ──────────────────────────────────────────────────────────────
  appstore:
    name: App Store
    runs-on: macos-latest
    if: github.event_name == 'push' || inputs.include_appstore
    steps:
      - uses: actions/checkout@v4

      - name: Import App Store certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPSTORE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE }}
        run: |
          # Temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import distribution certificate
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/mute_appstore.provisionprofile

      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/mute.xcarchive \
            -destination "generic/platform=macOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Export
        run: |
          xcodebuild -exportArchive \
            -archivePath build/mute.xcarchive \
            -exportPath build/appstore \
            -exportOptionsPlist ExportOptions-AppStore.plist

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            --type macos \
            --file "build/appstore/mute.pkg" \
            --username "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID"

  # ── Developer ID DMG (staged as a draft release) ────────────────────────────
  # Builds and notarizes the DMG and attaches it to a DRAFT GitHub release. It does
  # NOT touch the Homebrew tap — publishing is the manual "Promote release" workflow,
  # run once the App Store build is accepted, so Homebrew never serves a rejected build.
  dmg:
    name: Notarized DMG
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/mute-devid.xcarchive \
            -destination "generic/platform=macOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application: Dorian Grasset ($TEAM_ID)" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES

      - name: Export
        run: |
          xcodebuild -exportArchive \
            -archivePath build/mute-devid.xcarchive \
            -exportPath build/devid \
            -exportOptionsPlist ExportOptions-DeveloperID.plist

      - name: Create DMG
        run: |
          mkdir -p build/dmg
          cp -R build/devid/Mute.app build/dmg/Mute.app
          ln -s /Applications build/dmg/Applications
          hdiutil create \
            -volname Mute \
            -srcfolder build/dmg \
            -ov -format UDZO \
            build/Mute.dmg

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          SUBMISSION=$(xcrun notarytool submit build/Mute.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID" \
            --output-format json --wait)
          echo "$SUBMISSION"

          ID=$(echo "$SUBMISSION" | jq -r '.id')
          STATUS=$(echo "$SUBMISSION" | jq -r '.status')

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $STATUS. Apple log below:"
            xcrun notarytool log "$ID" \
              --apple-id "$APPLE_ID" \
              --password "$APP_SPECIFIC_PASSWORD" \
              --team-id "$TEAM_ID"
            exit 1
          fi

          xcrun stapler staple build/Mute.dmg

      - name: Stage draft GitHub release with the DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — refreshing its DMG asset (kept as draft)."
            gh release upload "$VERSION" build/Mute.dmg --clobber
          else
            echo "Creating DRAFT release $VERSION."
            gh release create "$VERSION" build/Mute.dmg \
              --title "$VERSION" \
              --generate-notes \
              --draft
          fi
          echo "::notice::DMG staged as a draft release. Once the App Store build is accepted, run the \"Promote release\" workflow for $VERSION to publish it and update Homebrew."
